name: Scientific ML numerical checks
on:
  push:
    paths:
      - 'topopt/mlnext/**'
      - 'mltests/test_mlnext.py'
      - 'requirements-mlnext.txt'
      - '.github/workflows/mlnext.yml'
  pull_request:
    paths:
      - 'topopt/mlnext/**'
      - 'mltests/test_mlnext.py'
      - 'requirements-mlnext.txt'
      - '.github/workflows/mlnext.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mlnext.txt
      - run: python -m pytest mltests/test_mlnext.py -v
